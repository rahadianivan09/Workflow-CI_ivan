name: MLflow CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  train-and-build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install --upgrade pip
        pip install -r MLProject/requirements.txt
        pip install mlflow

    # =========================
    # TRAINING
    # =========================
    - name: Run Training Script Directly
      run: |
        python MLProject/modelling.py

    # =========================
    # CHECK ARTIFACT (DEBUG OPTIONAL)
    # =========================
    - name: Verify Artifact
      run: |
        ls -R MLProject/artifacts/

    # =========================
    # UPLOAD ARTIFACT (FIXED)
    # =========================
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: trained-model-${{ github.run_id }}
        path: MLProject/artifacts/model/

    # =========================
    # LOGIN DOCKER HUB
    # =========================
    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # =========================
    # BUILD DOCKER IMAGE
    # =========================
    - name: Build Docker Image
      run: |
        mlflow models build-docker \
          -m MLProject/artifacts/model \
          -n telco-churn-model

    # =========================
    # TAG IMAGE
    # =========================
    - name: Tag Docker Image
      run: |
        docker tag telco-churn-model \
        ${{ secrets.DOCKER_USERNAME }}/telco-churn-model:latest

    # =========================
    # PUSH IMAGE
    # =========================
    - name: Push Docker Image
      run: |
        docker push \
        ${{ secrets.DOCKER_USERNAME }}/telco-churn-model:latest